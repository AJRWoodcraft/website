<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AJR Woodcraft | Handcrafted Goods</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700;800&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        wood: {
                            50: '#FDFBF7',
                            100: '#F4EFE6',
                            200: '#E2D4C0',
                            300: '#C8B092',
                            400: '#A98965',
                            500: '#8A6943',
                            600: '#6E4F31',
                            700: '#533B24',
                            800: '#3A2818',
                            900: '#23180E',
                            950: '#140D07',
                        },
                        amber: {
                            accent: '#D4AF37',
                            bright: '#F5B027',
                            warm: '#E2872A'
                        }
                    },
                    fontFamily: {
                        serif: ['Cinzel', 'serif'],
                        sans: ['Plus Jakarta Sans', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <style>
        body {
            background-color: #140D07;
            color: #E2D4C0;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }
        .wood-pattern {
            background-color: #140d07;
            background-image: radial-gradient(#23180e 1.5px, transparent 0);
            background-size: 28px 28px;
        }
        .glass-panel {
            background: rgba(35, 24, 14, 0.88);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(169, 137, 101, 0.22);
        }
        .glass-card {
            background: linear-gradient(145deg, rgba(35, 24, 14, 0.9) 0%, rgba(20, 13, 7, 0.96) 100%);
            border: 1px solid rgba(169, 137, 101, 0.18);
        }
        .glass-card:hover {
            border-color: rgba(212, 175, 55, 0.5);
            box-shadow: 0 12px 35px -10px rgba(0, 0, 0, 0.8), 0 0 20px rgba(212, 175, 55, 0.15);
        }
        .wood-gradient-text {
            background: linear-gradient(135deg, #F5B027 0%, #D4AF37 50%, #A98965 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #140D07;
        }
        ::-webkit-scrollbar-thumb {
            background: #3A2818;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #6E4F31;
        }
    </style>
</head>
<body class="wood-pattern min-h-screen flex flex-col antialiased">

    <!-- Top Merchant Bar -->
    <div id="topMerchantBar" class="admin-element hidden bg-wood-900 border-b border-wood-800 text-amber-accent/90 text-xs py-2 px-4 text-center font-medium tracking-wide flex justify-center items-center gap-2 flex-wrap">
        <span><i class="fa-solid fa-wrench mr-1"></i> <strong>Store Manager Active:</strong> Upload photos, edit prices/descriptions, or add products anytime.</span>
        <button onclick="scrollToGuide()" class="underline text-amber-bright font-bold hover:text-white transition-colors ml-1">View Setup Guide</button>
        <button onclick="exitAdminMode()" class="ml-2 px-2.5 py-1 rounded bg-wood-800 hover:bg-wood-700 text-amber-bright hover:text-white font-bold text-[11px] border border-wood-700 transition-colors flex items-center gap-1 shadow-sm">
            <i class="fa-solid fa-eye-slash"></i> Exit Admin Mode
        </button>
    </div>

    <!-- Navigation Header -->
    <header class="sticky top-0 z-40 glass-panel border-b border-wood-800/80 transition-all duration-300">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex items-center justify-between h-20">
                <a href="#" class="flex items-center space-x-3 group">
                    <div class="w-10 h-10 rounded-lg bg-gradient-to-br from-amber-accent to-wood-700 flex items-center justify-center text-wood-950 font-bold text-xl font-serif shadow-lg group-hover:scale-105 transition-transform">
                        AJR
                    </div>
                    <div class="flex flex-col">
                        <span class="font-serif text-xl font-bold tracking-wider text-wood-100 group-hover:text-amber-accent transition-colors">AJR WOODCRAFT</span>
                        <span class="text-[10px] tracking-widest text-wood-400 font-sans uppercase">Handcrafted Woodware • Est. 2024</span>
                    </div>
                </a>

                <nav class="hidden md:flex space-x-8 text-sm font-medium text-wood-200">
                    <a href="#hero" class="hover:text-amber-accent transition-colors py-1 border-b-2 border-transparent hover:border-amber-accent">Home</a>
                    <a href="#shop" class="hover:text-amber-accent transition-colors py-1 border-b-2 border-transparent hover:border-amber-accent">Shop Collections</a>
                    <a href="#howTo" class="admin-element hidden hover:text-amber-accent transition-colors py-1 border-b-2 border-transparent hover:border-amber-accent text-amber-bright font-bold"><i class="fa-solid fa-camera mr-1"></i> Image Instructions</a>
                    <a href="#commission" class="hover:text-amber-accent transition-colors py-1 border-b-2 border-transparent hover:border-amber-accent">Custom Order</a>
                </nav>

                <div class="flex items-center space-x-3">
                    <div class="relative hidden lg:block">
                        <input type="text" id="searchInput" oninput="handleSearch()" placeholder="Search crafts..." class="bg-wood-900/90 text-wood-100 text-sm rounded-full pl-9 pr-4 py-2 border border-wood-700 focus:outline-none focus:border-amber-accent w-48 transition-all">
                        <i class="fa-solid fa-magnifying-glass absolute left-3 top-2.5 text-wood-400 text-xs"></i>
                    </div>

                    <button onclick="openImageManagerModal('add')" class="admin-element hidden px-3.5 py-2 rounded-lg bg-amber-accent text-wood-950 font-bold text-xs hover:brightness-110 transition-all flex items-center space-x-1.5 shadow-md">
                        <i class="fa-solid fa-plus-circle"></i>
                        <span>Add Photo / Product</span>
                    </button>

                    <button onclick="openCartModal()" class="relative p-2.5 rounded-full bg-wood-800/80 border border-wood-700 text-wood-200 hover:text-amber-accent hover:border-amber-accent/50 transition-all">
                        <i class="fa-solid fa-basket-shopping text-lg"></i>
                        <span id="cartCountBadge" class="absolute -top-1 -right-1 bg-amber-accent text-wood-950 text-xs font-bold w-5 h-5 rounded-full flex items-center justify-center scale-0 transition-transform">0</span>
                    </button>
                </div>
            </div>
        </div>
    </header>

    <!-- Hero Banner -->
    <section id="hero" class="pt-6 pb-6 px-4 sm:px-6 lg:px-8 max-w-7xl mx-auto space-y-6">
        <div class="relative rounded-2xl overflow-hidden border border-wood-700/80 shadow-2xl bg-wood-950 group min-h-[160px] flex items-center justify-center">
            <img id="heroBannerImg" src="AJR_Banner.JPG" 
                 onerror="this.src='https://placehold.co/1200x400/23180E/F5B027?text=AJR+Woodcraft+Handcrafted+Banner'"
                 alt="AJR Woodcraft Handcrafted Banner" 
                 class="w-full h-auto object-contain max-h-[500px] mx-auto block">
            
            <div class="absolute bottom-3 right-3 flex items-center space-x-2">
                <button onclick="openImageManagerModal('banner')" class="admin-element hidden bg-amber-accent/95 hover:bg-amber-bright text-wood-950 font-bold text-xs px-3.5 py-2 rounded-lg shadow-lg flex items-center space-x-1.5 transition-all">
                    <i class="fa-solid fa-camera"></i>
                    <span>Change Banner Image</span>
                </button>
            </div>
        </div>
    </section>

    <!-- Product Shop Section -->
    <section id="shop" class="py-8 px-4 sm:px-6 lg:px-8 max-w-7xl mx-auto">
        <div class="flex flex-col md:flex-row md:items-end justify-between mb-8 gap-4 border-b border-wood-800 pb-6">
            <div>
                <span class="text-amber-accent text-xs font-bold tracking-widest uppercase">Artisan Woodcraft Catalog</span>
                <h2 class="font-serif text-3xl sm:text-4xl font-bold text-wood-50 mt-1">Featured Wooden Products</h2>
            </div>
            <div class="admin-element hidden flex items-center space-x-3">
                <button onclick="resetCatalogToDefault()" class="px-3 py-2 bg-wood-900 border border-wood-700 hover:border-red-400 text-wood-400 hover:text-red-300 rounded-lg text-xs font-semibold transition-all">
                    <i class="fa-solid fa-rotate-left mr-1"></i> Reset Catalog & Images
                </button>
            </div>
        </div>

        <div id="productGrid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6"></div>
    </section>

    <!-- Emergency Admin Unlock Button (Bottom Right) -->
    <button onclick="toggleAdminModeManual()" title="Click to toggle Admin Mode" class="fixed bottom-4 right-4 z-50 bg-amber-accent text-wood-950 font-bold px-3 py-2 rounded-full shadow-2xl text-xs flex items-center gap-1.5 border border-wood-950 hover:scale-105 transition-transform">
        <i class="fa-solid fa-shield-halved"></i> <span>Toggle Admin</span>
    </button>

    <!-- TOAST -->
    <div id="toast" class="fixed bottom-16 right-6 z-50 transform translate-y-20 opacity-0 transition-all duration-300 glass-panel border border-amber-accent/40 text-wood-100 px-5 py-3 rounded-xl shadow-2xl flex items-center space-x-3 pointer-events-none">
        <i id="toastIcon" class="fa-solid fa-circle-check text-amber-accent text-lg"></i>
        <span id="toastMsg" class="text-sm font-medium">Notification</span>
    </div>

    <!-- SCRIPT -->
    <script>
        const initialProducts = [
            { id: 'prod-1', name: "The Art of Endurance End-Grain Butcher Block", category: "Kitchen & Dining", price: 195.00, rating: 5.0, reviews: 42, image: "Endgrain.jpg", description: "Masterfully crafted for the modern epicure. Functional sculpture of beeswax-treated Red Oak and Walnut.", woodType: "Red Oak & Walnut" },
            { id: 'prod-4', name: "Halloween Decorative BOO Blocks", category: "Seasonal Decor", price: 36.00, rating: 5.0, reviews: 19, image: "BOO.jpg", description: "Hand-painted seasonal wooden block set spelling BOO with festive holiday accent colors.", woodType: "Solid Pine" },
            { id: 'prod-5', name: "Witch Silhouette Candy Dispenser Box", category: "Seasonal Decor", price: 68.00, rating: 4.9, reviews: 24, image: "Candy_box.jpg", description: "Handcrafted wooden trick-or-treat candy box featuring a laser-cut backlit witch silhouette inlay.", woodType: "Pine & Birch" },
            { id: 'prod-7', name: "Black Cat on Crescent Moon Live Edge Plaque", category: "Seasonal Decor", price: 55.00, rating: 5.0, reviews: 37, image: "Cat_on_moon.jpg", description: "Natural live-edge bark wood slab finished with harvest orange stain and intricate black cat silhouette.", woodType: "Natural Bark Slab" },
            { id: 'prod-8', name: "Nautical Wooden Boat Wall Planter", category: "Nautical & Planters", price: 85.00, rating: 4.9, reviews: 21, image: "Boat_planter.jpg", description: "Handcrafted flat-bottom wooden skiff planter finished in classic maritime colors with decorative rigging.", woodType: "Cedar & Pine" },
            { id: 'prod-9', name: "Candy Corn", category: "Seasonal Decor", price: 6.00, rating: 4.5, reviews: 20, image: "Candy_Corn.jpg", description: "Perfect for your holiday decor.", woodType: "Painted Pine" },
            { id: 'prod-10', name: "Pumpkin Lantern", category: "Seasonal Decor", price: 35.00, rating: 4.9, reviews: 29, image: "Pumpkin_lantern.png", description: "Laser cut pumpkin lantern. Hand painted.", woodType: "Plywood" }
        ];

        let products = [];
        let cart = [];
        let isAdmin = false;

        function initStore() {
            // Check URL parameters first
            const params = new URLSearchParams(window.location.search);
            if (params.get('admin') === 'true' || params.get('admin') === '1') {
                isAdmin = true;
                localStorage.setItem('ajr_admin_active', 'true');
            } else {
                isAdmin = localStorage.getItem('ajr_admin_active') === 'true';
            }

            // Load products from storage or fallback
            const saved = localStorage.getItem('ajr_woodcraft_products');
            if (saved) {
                try {
                    products = JSON.parse(saved);
                } catch(e) {
                    products = [...initialProducts];
                }
            } else {
                products = [...initialProducts];
            }

            applyAdminVisibility();
            renderProducts(products);
        }

        function toggleAdminModeManual() {
            isAdmin = !isAdmin;
            if (isAdmin) {
                localStorage.setItem('ajr_admin_active', 'true');
                showToast("Admin Mode Enabled!");
            } else {
                localStorage.removeItem('ajr_admin_active');
                showToast("Admin Mode Disabled (Customer View)");
            }
            applyAdminVisibility();
        }

        function exitAdminMode() {
            isAdmin = false;
            localStorage.removeItem('ajr_admin_active');
            applyAdminVisibility();
            showToast("Exited Admin Mode");
        }

        function applyAdminVisibility() {
            document.querySelectorAll('.admin-element').forEach(el => {
                if (isAdmin) {
                    el.classList.remove('hidden');
                } else {
                    el.classList.add('hidden');
                }
            });
        }

        function resetCatalogToDefault() {
            localStorage.removeItem('ajr_woodcraft_products');
            localStorage.removeItem('ajr_woodcraft_banner');
            products = [...initialProducts];
            renderProducts(products);
            showToast("Store catalog reset to default!");
        }

        function escapeHtml(str) {
            if (!str) return '';
            return String(str).replace(/"/g, '&quot;').replace(/'/g, '&#39;');
        }

        function renderProducts(items) {
            const grid = document.getElementById('productGrid');
            if (!grid) return;

            grid.innerHTML = items.map(p => `
                <div class="glass-card rounded-2xl overflow-hidden flex flex-col group">
                    <div class="relative overflow-hidden aspect-[4/3] bg-wood-900">
                        <img src="${escapeHtml(p.image)}" alt="${escapeHtml(p.name)}" 
                             onerror="this.src='https://placehold.co/600x450/23180E/F5B027?text=' + encodeURIComponent('${escapeHtml(p.name)}')"
                             class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-500">
                        <span class="absolute top-3 left-3 bg-wood-950/85 text-amber-accent text-[11px] font-bold px-2.5 py-1 rounded-md border border-amber-accent/30">
                            ${escapeHtml(p.category)}
                        </span>
                    </div>
                    <div class="p-5 flex-1 flex flex-col justify-between space-y-4">
                        <div>
                            <h3 class="font-serif text-base font-bold text-wood-100">${escapeHtml(p.name)}</h3>
                            <p class="text-xs text-wood-400 mt-1">${escapeHtml(p.description)}</p>
                        </div>
                        <div class="pt-2 border-t border-wood-800 flex items-center justify-between">
                            <span class="font-serif text-lg font-bold text-amber-accent">$${parseFloat(p.price).toFixed(2)}</span>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        function showToast(msg) {
            const toast = document.getElementById('toast');
            document.getElementById('toastMsg').textContent = msg;
            toast.classList.remove('translate-y-20', 'opacity-0');
            toast.classList.add('translate-y-0', 'opacity-100');
            setTimeout(() => {
                toast.classList.remove('translate-y-0', 'opacity-100');
                toast.classList.add('translate-y-20', 'opacity-0');
            }, 2500);
        }

        // Run immediately on script load
        window.addEventListener('DOMContentLoaded', initStore);
    </script>
</body>
</html>
